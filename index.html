<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GroWiz Scanner Pro</title>
<style>
body{background:#000;color:#00ff88;font-family:system-ui;padding:14px;margin:0}
button{width:100%;padding:16px;font-size:18px;background:#00ff88;color:#000;border:0;border-radius:12px;font-weight:800}
.card{background:#0a0f0a;border:1px solid #00ff8833;padding:14px;border-radius:12px;margin-top:12px;border-left:6px solid #00ff88}
.card.put{border-left-color:#ff3333}
.entry{color:#4da6ff;font-weight:800;font-size:18px}
.bear{color:#ff4444}
.bull{color:#00ff88}
.tp{color:#00ff88}.sl{color:#ff4444}
small{color:#888}
.footer{text-align:center;margin-top:30px;padding:20px;color:#555;font-size:11px}
.hdr{position:sticky;top:0;background:#000;padding:10px 0;z-index:10;border-bottom:1px solid #00ff8822}
.kv{display:flex;justify-content:space-between;padding:4px 0}
</style>
</head>
<body>
<div class="hdr">
<h2 style="margin:0;color:#00ff88">GroWiz Scanner Pro</h2>
<small>5 MIN | 39 Forex + 6 Commodities + 7 Crypto | <span id="kz"></span></small><br><br>
<button id="btn" onclick="toggle()">START SCAN</button>
<p id="status" style="color:#666;font-size:12px"></p>
</div>
<div id="out"></div>

<div class="footer">market inside data analysis</div>

<script>
let scanning=false, timer=null;
const FOREX=[["EUR/USD","EURUSD=X"],["GBP/USD","GBPUSD=X"],["USD/JPY","JPY=X"],["USD/CHF","CHF=X"],["AUD/USD","AUDUSD=X"],["USD/CAD","CAD=X"],["NZD/USD","NZDUSD=X"],["EUR/GBP","EURGBP=X"],["EUR/JPY","EURJPY=X"],["GBP/JPY","GBPJPY=X"],["AUD/JPY","AUDJPY=X"],["CHF/JPY","CHFJPY=X"],["CAD/JPY","CADJPY=X"],["NZD/JPY","NZDJPY=X"],["EUR/AUD","EURAUD=X"],["EUR/CAD","EURCAD=X"],["EUR/CHF","EURCHF=X"],["EUR/NZD","EURNZD=X"],["GBP/AUD","GBPAUD=X"],["GBP/CAD","GBPCAD=X"],["GBP/CHF","GBPCHF=X"],["GBP/NZD","GBPNZD=X"],["AUD/CAD","AUDCAD=X"],["AUD/CHF","AUDCHF=X"],["AUD/NZD","AUDNZD=X"],["CAD/CHF","CADCHF=X"],["NZD/CAD","NZDCAD=X"],["NZD/CHF","NZDCHF=X"],["USD/SGD","SGD=X"],["USD/HKD","HKD=X"],["USD/MXN","MXN=X"],["USD/ZAR","ZAR=X"],["USD/TRY","TRY=X"],["EUR/TRY","EURTRY=X"],["GBP/TRY","GBPTRY=X"],["USD/SEK","SEK=X"],["USD/NOK","NOK=X"],["EUR/SEK","EURSEK=X"],["EUR/NOK","EURNOK=X"]];
const COMMODITIES=[["GOLD","GC=F"],["SILVER","SI=F"],["US OIL","CL=F"],["BRENT OIL","BZ=F"],["NAT GAS","NG=F"],["COPPER","HG=F"]];
const CRYPTO=[["BTC/USD","BTCUSDT"],["ETH/USD","ETHUSDT"],["SOL/USD","SOLUSDT"],["BNB/USD","BNBUSDT"],["XRP/USD","XRPUSDT"],["DOGE/USD","DOGEUSDT"],["ADA/USD","ADAUSDT"]];

function killzone(){const h=new Date().getUTCHours();if(h>=7&&h<10)return'London KZ - HIGH';if(h>=12&&h<15)return'NY KZ - HIGH';if(h>=2&&h<5)return'Asia - AVOID';return'Off-hours - MED';}
document.getElementById('kz').innerText=killzone();

function findOB(c){for(let i=c.length-3;i>2;i--){const b=c[i];if(Math.abs(b.close-b.open)>(b.high-b.low)*0.6){if(b.close>b.open&&c[i+1].close<c[i+1].open)return{t:'Bullish OB',b:b.low,tt:b.high};if(b.close<b.open&&c[i+1].close>c[i+1].open)return{t:'Bearish OB',b:b.low,tt:b.high};}}return null;}
function findFVG(c){for(let i=c.length-2;i>1;i--){if(c[i-1].high<c[i+1].low)return{t:'Bullish FVG',b:c[i-1].high,tt:c[i+1].low};if(c[i-1].low>c[i+1].high)return{t:'Bearish FVG',b:c[i+1].high,tt:c[i-1].low};}return null;}
function findLiq(c){const rec=c.slice(-20);const hi=Math.max(...rec.map(x=>x.high));const lo=Math.min(...rec.map(x=>x.low));const l=c[c.length-1];if(l.high>hi*0.999&&l.close<l.high)return{t:'BEARISH',d:`SRM swept @ ${l.high.toFixed(5)}`};if(l.low<lo*1.001&&l.close>l.low)return{t:'BULLISH',d:`BRM swept @ ${l.low.toFixed(5)}`};return null;}
function isChoppy(c){const atr=c.slice(-14).reduce((a,x)=>a+(x.high-x.low),0)/14;return (c[c.length-1].high-c[c.length-1].low)<atr*0.5;}

function calcLevels(c,dir,ob){
  const entry=c[c.length-1].close;
  let sl, tp;
  const swingLow=Math.min(...c.slice(-10).map(x=>x.low));
  const swingHigh=Math.max(...c.slice(-10).map(x=>x.high));
  const buf=(swingHigh-swingLow)*0.1;
  if(dir==='CALL'){
    sl = ob && ob.t.includes('Bullish')? ob.b - buf*0.2 : swingLow - buf;
    let risk=entry-sl; if(risk<=0) risk=entry*0.001;
    tp=entry+risk*2;
  }else{
    sl = ob && ob.t.includes('Bearish')? ob.tt + buf*0.2 : swingHigh + buf;
    let risk=sl-entry; if(risk<=0) risk=entry*0.001;
    tp=entry-risk*2;
  }
  return {entry,sl,tp};
}

function score(c){
  const ob=findOB(c),fvg=findFVG(c),liq=findLiq(c);
  let s=0,r=[];
  if(ob){s+=25;r.push(`${ob.t}`);}
  if(fvg){s+=20;r.push(`${fvg.t}`);}
  if(liq){s+=25;r.push(liq.d);}
  const bullishMS=c[c.length-1].close>c[c.length-10].close;
  s+=10;r.push(bullishMS?'Bullish MS (HH/HL)':'Bearish MS (LH/LL)');
  const bull=(ob?.t.includes('Bullish')?1:0)+(fvg?.t.includes('Bullish')?1:0)+(liq?.t==='BULLISH'?1:0)+(bullishMS?1:0);
  const bear=(ob?.t.includes('Bearish')?1:0)+(fvg?.t.includes('Bearish')?1:0)+(liq?.t==='BEARISH'?1:0)+(!bullishMS?1:0);
  let dir='NONE';
  if(s>=50) dir=bull>=bear?'CALL':'PUT';
  if(dir==='NONE') return {dir};
  const lv=calcLevels(c,dir,ob);
  const l=c[c.length-1];
  return {dir,conf:Math.min(s,95),r,vol:l.close>l.open?'Buyside':'Sellside',ob,fvg,liq,ms:bullishMS?'Bullish':'Bearish',...lv};
}

async function getYahoo(sym){
  const url=`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=5m&range=1d`)}`;
  const res=await fetch(url);const j=await res.json();
  const r=j.chart.result[0];const q=r.indicators.quote[0];let out=[];
  for(let i=0;i<r.timestamp.length;i++){if(!q.close[i])continue;out.push({open:q.open[i],high:q.high[i],low:q.low[i],close:q.close[i]});}
  return out;
}
async function getCrypto(sym){
  const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=5m&limit=50`);
  const d=await r.json();return d.map(k=>({open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
}
function fmt(n){return n>1000?n.toFixed(2):n>10?n.toFixed(3):n.toFixed(5);}

async function scan(){
  document.getElementById('status').innerText='Scanning 52 markets...';
  let res=[];
  for(let [lbl,sym] of [...FOREX,...COMMODITIES]){
    try{const c=await getYahoo(sym);if(!c||c.length<20||isChoppy(c))continue;const s=score(c);if(s.dir!=='NONE')res.push({pair:lbl,...s});}catch(e){}
    await new Promise(r=>setTimeout(r,100));
  }
  for(let [lbl,sym] of CRYPTO){
    try{const c=await getCrypto(sym);if(!c||c.length<20||isChoppy(c))continue;const s=score(c);if(s.dir!=='NONE')res.push({pair:lbl,...s});}catch(e){}
  }
  res.sort((a,b)=>b.conf-a.conf);res=res.slice(0,3);
  let html='';
  res.forEach((t,i)=>{
    const isPut=t.dir==='PUT';
    html+=`<div class="card ${isPut?'put':''}">
    <b class="${isPut?'bear':'bull'}">#${i+1} ${t.pair} - ${t.dir} ${t.conf}%</b><br>
    <small>5 MIN | ${killzone()} | ICT + MS</small><br><br>
    <div class="kv"><span>Entry:</span><span class="entry">${fmt(t.entry)}</span></div>
    <div class="kv"><span>SL:</span><span class="sl">${fmt(t.sl)}</span></div>
    <div class="kv"><span>TP (1:2):</span><span class="tp">${fmt(t.tp)}</span></div>
    <hr style="border-color:#222">
    <div>Volume: <span class="${t.vol==='Buyside'?'bull':'bear'}">${t.vol}</span></div>
    <div>Liquidity: ${t.liq?t.liq.d:'No sweep'}</div>
    <div>Structure: <span class="${t.ms==='Bearish'?'bear':'bull'}">${t.ms}</span></div>
    <div>OB: ${t.ob?t.ob.t+' '+fmt(t.ob.b)+'-'+fmt(t.ob.tt):'No OB'}</div>
    <div>FVG: ${t.fvg?t.fvg.t:'No FVG'}</div>
    <small>${t.r.join(' | ')}</small>
    </div>`;
  });
  if(!res.length)html='<p style="color:#666">No A+ setup. Wait for Killzone.</p>';
  document.getElementById('out').innerHTML=html;
  document.getElementById('status').innerText='Last: '+new Date().toLocaleTimeString();
}
function toggle(){
  scanning=!scanning;
  document.getElementById('btn').innerText=scanning?'STOP SCAN':'START SCAN';
  document.getElementById('btn').style.background=scanning?'#ff4444':'#00ff88';
  if(scanning){scan();timer=setInterval(scan,120000);}else clearInterval(timer);
}
</script>
</body>
</html>
